<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a2f57" />
    <link rel="apple-touch-icon" href="/Content/img/app-icons/apple-touch-icon.png" />
    <meta name="description" content="SmartPort — hệ thống điều hành cảng container (React + ASP.NET Core Web API)" />
    <title>SmartPort · Điều hành cảng</title>
    <script>
      // Ap giao dien sang/toi TRUOC khi React ve -> khong nhay trang trang khi tai trang
      try {
        var t = localStorage.getItem('sp-theme')
        if (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark'
        document.documentElement.setAttribute('data-bs-theme', t === 'dark' ? 'dark' : 'light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
