<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#ffffff;}
  svg{display:block;}
  text{font-family:'Segoe UI',Arial,sans-serif;fill:#0A2F57;}
  .boundary{fill:#F8FAFC;stroke:#0A2F57;stroke-width:2.5;}
  .uc{fill:#ffffff;stroke:#0A2F57;stroke-width:2.25;}
  .uc-ai{fill:#FFF4EC;stroke:#FF7D2D;stroke-width:2.25;}
  .uctxt{font-size:15.5px;font-weight:600;}
  .actorlbl{font-size:17px;font-weight:700;}
  .rel{stroke:#5b6b82;stroke-width:1.75;fill:none;}
  .boundtitle{font-size:21px;font-weight:700;}
  .actor{stroke:#0A2F57;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;}
</style></head>
